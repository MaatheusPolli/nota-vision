name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
        env:
          ANTHROPIC_API_KEY: ""   # CI nunca chama o LLM real
      - run: pnpm eval   # respostas simuladas; falha se a qualidade cair abaixo dos limiares
      - run: pnpm --filter @nota-vision/web build
